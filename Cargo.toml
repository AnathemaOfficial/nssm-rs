[package]
name = "nssm-rs"
version = "0.1.0"
edition = "2021"
description = "A modern Windows service manager written in Rust — NSSM replacement"
license = "MIT"
repository = "https://github.com/AnathemaOfficial/nssm-rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
windows-service = "0.7"
winreg = "0.55"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Services",
    "Win32_Security",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
